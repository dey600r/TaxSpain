<header class="app-header">
	<button
		mat-icon-button
		type="button"
		class="menu-trigger"
		aria-label="Abrir menu"
		(click)="toggleMenu()"
	>
		<mat-icon>menu</mat-icon>
	</button>

	<h1>TaxSpain Dashboard</h1>

	<div class="header-actions">
		<button mat-stroked-button type="button" (click)="exportStorage()">Exportar JSON</button>

		<label class="import-label" for="storage-import-input">Importar JSON</label>
		<input
			id="storage-import-input"
			class="import-input"
			type="file"
			accept="application/json,.json"
			(change)="importStorageFromFile($event)"
		/>
	</div>
</header>

<mat-sidenav-container class="app-shell">
	<mat-sidenav #appSidenav mode="over" class="app-sidenav">
		<mat-nav-list>
			<a
				mat-list-item
				routerLink="/dashboard"
				routerLinkActive="active-link"
				[routerLinkActiveOptions]="{ exact: true }"
				(click)="closeMenu()"
			>
				<mat-icon matListItemIcon>dashboard</mat-icon>
				<span matListItemTitle>Dashboard</span>
			</a>

			<a
				mat-list-item
				routerLink="/cuenta-anual"
				routerLinkActive="active-link"
				[routerLinkActiveOptions]="{ exact: true }"
				(click)="closeMenu()"
			>
				<mat-icon matListItemIcon>calculate</mat-icon>
				<span matListItemTitle>Cuenta anual</span>
			</a>
		</mat-nav-list>
	</mat-sidenav>

	<mat-sidenav-content>
		<main class="app-content">
			<router-outlet></router-outlet>
		</main>
	</mat-sidenav-content>
</mat-sidenav-container>
